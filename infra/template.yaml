AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  NEXUS infrastructure: shared Lambda layer, agent functions, changefeed receiver
  and fallback poller, EventBridge bus, Step Functions pipeline, S3 artifacts,
  Secrets Manager, and CloudWatch.

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues: [development, staging, production]
  BedrockModelId:
    Type: String
    # The `us.` prefix is an inference profile, not decoration. This model reports
    # `inferenceTypesSupported: [INFERENCE_PROFILE]`, so invoking the bare id
    # `anthropic.claude-opus-5` is rejected outright with
    # `ValidationException: Operation not allowed` — which looks identical to a
    # missing model-access grant and wastes an afternoon.
    Default: us.anthropic.claude-opus-5
    Description: >-
      Claude inference-profile id (Bedrock) for reasoning, mutation, and merge.
      Must be the us.* profile form; bare foundation-model ids are not invocable
      for this model.
  GeneratorUrl:
    Type: String
    Default: ""
    Description: >
      Base URL of the synthetic fleet control API (`make live`). The dashboard's
      ramp control proxies to it. Left empty, the control reports itself
      unconfigured rather than pretending a ramp started.
  DashboardAllowOrigin:
    Type: String
    Default: "*"
    Description: CORS origin for the dashboard read API.
  BedrockEmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Titan Embeddings V2 (1024-dim output).
  EmbeddingDim:
    Type: String
    Default: "1024"
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 512
    Layers:
      - !Ref SharedLayer
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !Ref LogLevel
        EVENT_BUS_NAME: !Ref NexusBus
        METRIC_NAMESPACE: NEXUS
        ARTIFACTS_BUCKET: !Ref ArtifactsBucket
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_EMBEDDING_MODEL_ID: !Ref BedrockEmbeddingModelId
        EMBEDDING_DIM: !Ref EmbeddingDim
        DB_SECRET_NAME: !Ref DbSecret
        CHANGEFEED_SECRET_NAME: !Ref ChangefeedSecret
        CCLOUD_SECRET_NAME: !Ref CcloudSecret

Resources:
  # Shared Lambda layer: psycopg3 + numpy + nexus_common (db/bedrock/log/config)
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Metadata:
      # `makefile`, not `python3.12`: that builder copies ContentUri's source tree
      # and pip-installs into `python/`, and since our source already keeps the
      # package at `python/nexus_common` it shipped to `/opt/python/python/` —
      # one level below the `/opt/python` Lambda puts on sys.path. Every function
      # deployed cleanly and died at import. See layers/shared/Makefile.
      BuildMethod: makefile
    Properties:
      LayerName: !Sub "nexus-shared-${Environment}"
      ContentUri: ../layers/shared
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]
      RetentionPolicy: Delete

  # Secrets (created empty; populate after deploy — see README).
  #   put-secret-value --secret-id nexus/db --secret-string '{"dsn":"postgresql://..."}'
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: nexus/db
      Description: CockroachDB connection string (+ inline CA cert) for NEXUS.
      SecretString: '{"dsn":"REPLACE_ME","ca_cert":"REPLACE_ME"}'
  ChangefeedSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: nexus/changefeed
      Description: Shared secret the changefeed webhook must present.
      SecretString: '{"shared_secret":"REPLACE_ME"}'
  CcloudSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: nexus/ccloud
      Description: Read-only ccloud service-account API key (Guardian).
      SecretString: '{"api_key":"REPLACE_ME"}'

  # S3 artifacts bucket (prefixes are key conventions: incidents/, playbook-versions/, demo-assets/)
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "nexus-artifacts-${AWS::AccountId}-${Environment}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # EventBridge custom bus
  NexusBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: nexus-bus

  # Changefeed receiver (Function URL, in-code shared-secret check)
  ReceiverFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "nexus-receiver-${Environment}"
      CodeUri: ../agents/receiver
      Handler: app.handler
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - Statement:
            - Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt NexusBus.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref ChangefeedSecret

  # Fallback poller — schedule disabled by default
  PollerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "nexus-poller-${Environment}"
      CodeUri: ../agents/poller
      Handler: app.handler
      Events:
        PollSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: false
      Policies:
        - Statement:
            - Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt NexusBus.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbSecret

  # Oracle — scheduled predictor (60s interval, disabled by default)
  OracleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "nexus-oracle-${Environment}"
      CodeUri: ../agents/oracle
      Handler: app.handler
      Timeout: 60
      Events:
        PredictSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: false
      Policies:
        - !Ref DbReadPolicy
        - !Ref BedrockInvokePolicy
        - !Ref CloudWatchMetricsPolicy

  # Pipeline agents (invoked by Step Functions)
  SentinelFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "nexus-sentinel-${Environment}"
      CodeUri: ../agents/sentinel
      Handler: app.handler
      Policies:
        - !Ref DbReadPolicy
        - !Ref CloudWatchMetricsPolicy

  DiagnosticianFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "nexus-diagnostician-${Environment}"
      CodeUri: ../agents/diagnostician
      Handler: app.handler
      Timeout: 60
      Policies:
        - !Ref DbReadPolicy
        - !Ref BedrockInvokePolicy
        - !Ref S3ArtifactsPolicy
        - !Ref CloudWatchMetricsPolicy

  GuardianFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "nexus-guardian-${Environment}"
      CodeUri: ../agents/guardian
      Handler: app.handler
      Timeout: 120
      Policies:
        - !Ref DbReadPolicy
        - !Ref S3ArtifactsPolicy
        - !Ref CloudWatchMetricsPolicy
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref CcloudSecret

  ChroniclerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "nexus-chronicler-${Environment}"
      CodeUri: ../agents/chronicler
      Handler: app.handler
      Timeout: 60
      Policies:
        - !Ref DbReadPolicy
        - !Ref BedrockInvokePolicy
        - !Ref CloudWatchMetricsPolicy
      Events:
        # The stale sweep, on its own schedule. A prediction abandoned in
        # `preventing` holds Oracle's dedup guard, so without this a dead pipeline
        # execution makes that failure permanently unpredictable. Chronicler also
        # sweeps on every pipeline run; this is what covers the quiet days.
        StaleSweep:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Name: !Sub "nexus-stale-sweep-${Environment}"
            Description: Expire unanswered approvals and release abandoned predictions
            Input: '{"sweep": true}'

  # Dashboard API — the only thing the frontend talks to. Eight read routes plus
  # the ramp control and the approval decision, routed in-code behind a Function
  # URL. The approval decision is its only write to the memory layer; the ramp
  # control proxies to the fleet generator.
  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "nexus-dashboard-${Environment}"
      CodeUri: ../agents/dashboard
      Handler: app.handler
      Timeout: 30
      MemorySize: 1024
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [!Ref DashboardAllowOrigin]
          # No OPTIONS: it is not a legal value here (GET/PUT/HEAD/POST/PATCH/
          # DELETE/* only) and listing it fails CloudFormation's early property
          # validation before the changeset is even created. Function URL CORS
          # answers preflight itself, and the handler has its own OPTIONS branch.
          AllowMethods: [GET, POST]
          AllowHeaders: [content-type]
          MaxAge: 300
      Environment:
        Variables:
          GENERATOR_URL: !Ref GeneratorUrl
          DASHBOARD_ALLOW_ORIGIN: !Ref DashboardAllowOrigin
          EVENT_BUS_NAME: !Ref NexusBus
      Policies:
        - !Ref DbReadPolicy
        # Approving an irreversible remediation puts one event on the bus, which
        # is what starts the post-approval execution. Scoped to this bus only.
        - Statement:
            - Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt NexusBus.Arn

  # Reusable least-privilege managed policies (no wildcards on resources)
  DbReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref DbSecret

  BedrockInvokePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: bedrock:InvokeModel
            Resource:
              - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
              - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockEmbeddingModelId}"

  S3ArtifactsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [s3:PutObject, s3:GetObject]
            Resource: !Sub "${ArtifactsBucket.Arn}/*"

  CloudWatchMetricsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: cloudwatch:PutMetricData
            Condition:
              StringEquals:
                cloudwatch:namespace: NEXUS
            Resource: "*"

  # Step Functions pipeline: Sentinel -> Diagnostician -> Guardian -> Chronicler
  PipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "nexus-pipeline-${Environment}"
      Type: STANDARD
      DefinitionUri: statemachine/nexus.asl.json
      DefinitionSubstitutions:
        SentinelArn: !GetAtt SentinelFunction.Arn
        DiagnosticianArn: !GetAtt DiagnosticianFunction.Arn
        GuardianArn: !GetAtt GuardianFunction.Arn
        ChroniclerArn: !GetAtt ChroniclerFunction.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt SentinelFunction.Arn
                - !GetAtt DiagnosticianFunction.Arn
                - !GetAtt GuardianFunction.Arn
                - !GetAtt ChroniclerFunction.Arn
      Events:
        PredictionCreated:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref NexusBus
            Pattern:
              source: [nexus.changefeed, nexus.poller]
              detail-type: [prediction.created]

  # Post-approval execution: Guardian -> Chronicler. Step Functions cannot resume
  # a finished execution mid-machine, so an irreversible remediation a human has
  # authorized runs here — the same two Lambdas, entered where the gate stopped.
  ApprovedStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "nexus-approved-${Environment}"
      Type: STANDARD
      DefinitionUri: statemachine/approved.asl.json
      DefinitionSubstitutions:
        GuardianArn: !GetAtt GuardianFunction.Arn
        ChroniclerArn: !GetAtt ChroniclerFunction.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt GuardianFunction.Arn
                - !GetAtt ChroniclerFunction.Arn
      Events:
        ApprovalApproved:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref NexusBus
            Pattern:
              source: [nexus.dashboard]
              detail-type: [approval.approved]

  # CloudWatch dashboard
  NexusDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "NEXUS-${Environment}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Predictions & Preventions",
                "region": "${AWS::Region}",
                "metrics": [
                  ["NEXUS", "predictions_emitted"],
                  ["NEXUS", "preventions"],
                  ["NEXUS", "rollbacks"],
                  ["NEXUS", "lifecycle_events"]
                ],
                "view": "timeSeries", "stat": "Sum", "period": 60
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Pipeline Lambda errors",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "nexus-sentinel-${Environment}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "nexus-guardian-${Environment}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "nexus-chronicler-${Environment}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "nexus-receiver-${Environment}"]
                ],
                "view": "timeSeries", "stat": "Sum", "period": 60
              }
            }
          ]
        }

Outputs:
  ReceiverUrl:
    Description: Changefeed webhook endpoint (put this in sql/changefeed.sql).
    Value: !GetAtt ReceiverFunctionUrl.FunctionUrl
  DashboardApiUrl:
    Description: Dashboard read API (set this as VITE_API_BASE_URL in frontend/.env).
    Value: !GetAtt DashboardFunctionUrl.FunctionUrl
  EventBusName:
    Value: !Ref NexusBus
  StateMachineArn:
    Value: !Ref PipelineStateMachine
  ApprovedStateMachineArn:
    Value: !Ref ApprovedStateMachine
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
  DashboardName:
    Value: !Sub "NEXUS-${Environment}"
