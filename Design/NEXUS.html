document.addEventListener('DOMContentLoaded', async function() {

  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

l.dotStyle }}\"><\u002Fspan>\n                    <button sc-camel-on-click=\"{{ l.onClick }}\" style=\"flex:1;text-align:left;padding:6px 0;min-width:0\">\n                      <div style=\"font-size:11.5px;color:{{ l.color }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ l.name }}<\u002Fdiv>\n                      <div style=\"font-family:'JetBrains Mono',monospace;font-size:9px;color:#4E5663\">g{{ l.gen }} · {{ l.id }} · {{ l.mean }}<\u002Fdiv>\n                    <\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.07)\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;color:#5A6270;margin-bottom:11px\">REMEDIATION STEPS<\u002Fdiv>\n              <sc-for list=\"{{ pbDetail.steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <div style=\"padding:9px 11px;border:1px solid rgba(255,255,255,.06);border-radius:5px;background:#0c0e12;margin-bottom:7px\">\n                  <div style=\"display:flex;align-items:baseline;gap:7px\">\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;color:#4E5663\">{{ s.n }}<\u002Fspan>\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#DDE2EA\">{{ s.action }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#6B7381;margin-top:4px;padding-left:16px\">{{ s.params }}<\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:6px;margin-top:5px;padding-left:16px\">\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;color:#FF6B5E;opacity:.8\">↩<\u002Fspan>\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#8A93A1\">{{ s.invers =\"margin:0;font-size:19px;font-weight:600;letter-spacing:-.015em;color:#E8EBF0\">Evolution<\u002Fh1>\n              <p style=\"margin:5px 0 0;font-size:12.5px;color:#7C8593\">{{ evoSub }}<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:14px;align-items:center\">\n              <sc-for list=\"{{ evoLegend }}\" as=\"l\" hint-placeholder-count=\"4\">\n                <span style=\"display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.06em;color:#7C8593\">\n                  <span style=\"width:7px;height:7px;border-radius:2px;background:{{ l.color }}\"><\u002Fspan>{{ l.k }}\n                <\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:14px;padding:10px 24px;border-bottom:1px solid rgba(255,255,255,.055);align-items:flex-start\">\n            <div style=\"display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:0\">\n              <sc-for list=\"{{ evoFilters }}\" as=\"f\" hint-placeholder-count=\"6\">\n                <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:1px;flex:none;border:1px solid rgba(255,255,255,.07);border-radius:5px;overflow:hidden\">\n              <sc-for list=\"{{ zooms }}\" as=\"z\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ z.onClick }}\" style=\"{{ z.style }}\">{{ z.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;overflow:auto;position:relative\">\n            <div style=\"{{ tree.canvasStyle }}\">\n              <svg width=\"{{ tree.w }}\" height=\"{{ tree.h }}\" style=\"position:absolute;left:0;top:0;overflow:visible\">\n                <sc-for list=\"{{ tree.edges }}\" as=\"e\" hint-placeholder-count=\"20\">\n                  <path d=\"{{ e.d }}\" fill=\"none\" stroke=\"{{ e.color }}\" stroke-width=\"{{ e.w }}\" stroke-dasharray=\"{{ e.dash }}\" opacity=\"{{ e.o }}\"><\u002Fpath>\n                <\u002Fsc-for>\n              <\u002Fsvg>\n              <sc-for list=\"{{ tree.nodes }}\" as=\"n\" hint-placeholder-count=\"20\">\n                <button sc-camel-on-click=\"{{ n.onClick }}\" style=\"{{ n.style }}\">\n                  <div style=\"display:flex;align-items:center;gap:6px;width:100%\">\n                    <span style=\"{{ n.dotStyle }}\"><\u002Fspan>\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:8.5px;color:#5A6270\">g{{ n.gen }}<\u002Fspan>\n                    <div style=\"flex:1\"><\u002Fdiv>\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;color:{{ n.meanColor }};font-variant-numeric:tabular-nums\">{{ n.mean }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:10.5px;color:{{ n.nameColor }};line-height:1.3;text-align:left;width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical\">{{ n.name }}<\u002Fdiv>\n                  <div style=\"width:100%;height:3px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden\">\n                    <div style=\"height:100%;width:{{ n.meanPct }}%;background:{{ n.color }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <aside style=\"width:352px;flex:none;border-left:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;min-height:0;background:#0a0c0f\">\n          <div style=\"padding:14px 18px 11px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:8px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;color:#5A6270\">EVOLUTION_LOG<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;color:#454C58\">append-only<\u002Fspan>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <span style=\"width:5px;height:5px;border-radius:99px;background:#46D39A;animation:nx-pulse 2s ease-in-out infinite\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;overflow-y:auto\">\n            <sc-for list=\"{{ evoFeed }}\" as=\"e\" hint-placeholder-count=\"20\">\n              <div style=\"{{ e.style }}\">\n                <div style=\"display:flex;align-items:flex-start;gap:9px\">\n                  <span style=\"{{ e.glyphStyle }}\">{{ e.glyph }}<\u002Fspan>\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"display:flex;align-items:baseline;gap:6px\">\n                      <span style=\"font-size:11.5px;font-weight:500;color:{{ e.color }};letter-spacing:.02em\">{{ e.type }}<\u002Fspan>\n                      <div style=\"flex:1\"><\u002Fdiv>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;color:#454C58\">{{ e.ago }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#9AA3B2;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ e.name }}<\u002Fdiv>\n                    <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#5A6270;margin-top:3px;line-height:1.5;text-wrap:pretty\">{{ e.detail }}<\u002Fdiv>\n                    <sc-if value=\"{{ e.hasDelta }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"display:flex;align-items:center;gap:7px;margin-top:5px\">\n                        <span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#6B7381;font-variant-numeric:tabular-nums\">{{ e.fb }}<\u002Fspan>\n                        <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;color:#4E5663\">→<\u002Fspan>\n                        <span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;color:{{ e.deltaColor }};font-variant-numeric:tabular-nums\">{{ e.fa }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Faside>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isApprovals }}\" hint-placeholder-val=\"{{ false }}\">\n      <section data-screen-label=\"Approvals\" style=\"padding:22px 26px 44px;display:flex;flex-direction:column;gap:16px;max-width:1180px\">\n        <div>\n          <h1 style=\"margin:0;font-size:19px;font-weight:600;letter-spacing:-.015em;color:#E8EBF0\">Approvals<\u002Fh1>\n          <p style=\"margin:5px 0 0;font-size:12.5px;color:#7C8593;text-wrap:pretty\">{{ apprSub }}<\u002Fp>\n        <\u002Fdiv>\n\n        <sc-for list=\"{{ approvals }}\" as=\"a\" hint-placeholder-count=\"1\">\n          <div style=\"border:1px solid rgba(242,180,87,.28);border-radius:9px;background:#101217;overflow:hidden;box-shadow:0 0 0 1px rgba(242,180,87,.04),inset 0 1px 0 rgba(255,255,255,.035)\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(242,180,87,.05)\">\n              <span style=\"width:6px;height:6px;border-radius:99px;background:#F2B457;animation:nx-pulse 1.8s ease-in-out infinite\"><\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;color:#F2B457\">HUMAN APPROVAL REQUIRED<\u002Fspan>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#7C8593\">pipeline paused · {{ a.waiting }} waiting<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 344px\">\n              <div style=\"padding:18px;border-right:1px solid rgba(255,255,255,.07)\">\n                <div style=\"display:flex;align-items:flex-start;gap:16px\">\n                  <div style=\"flex:1;min-width:0\">\n                    <h2 style=\"margin:0;font-size:19px;font-weight:600;letter-spacing:-.018em;color:#E8EBF0\">{{ a.category }}<\u002Fh2>\n                    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A93A1;margin-top:6px\">{{ a.svc }} <span style=\"color:#3E4550\">/<\u002Fspan> {{ a.region }} <span style=\"color:#3E4550\">/<\u002Fspan> <span style=\"color:#646C7A\">{{ a.id }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:3px\">\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.11em;color:#5A6270\">FAILURE IN<\u002Fspan>\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:500;color:#F2B457;font-variant-numeric:tabular-nums;line-height:1\">{{ a.eta }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"margin-top:16px;padding:11px 13px;border:1px solid rgba(255,107,94,.22);border-radius:6px;background:rgba(255,107,94,.045)\">\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.11em;color:#FF6B5E;margin-bottom:5px\">WHY THIS NEEDS A HUMAN<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#C0968E;line-height:1.55;text-wrap:pretty\">{{ a.reason }}<\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"margin-top:16px\">\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;color:#5A6270;margin-bottom:9px\">PROPOSED PLAYBOOK<\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:10px\">\n                    <span style=\"{{ a.tierStyle }}\">{{ a.tier }}<\u002Fspan>\n                    <span style=\"font-size:13.5px;font-weight:500;color:#E8EBF0;letter-spacing:-.01em\">{{ a.pbName }}<\u002Fspan>\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#5A6270\">{{ a.pbId }} · g{{ a.pbGen }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ a.steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.045)\">\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;color:#4E5663;width:14px;flex:none;padding-top:2px\">{{ s.n }}<\u002Fspan>\n                      <div style=\"flex:1;min-width:0\">\n                        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#DDE2EA\">{{ s.action }}<\u002Fspan>\n                        <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#5A6270;margin-left:8px\">{{ s.params }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <span style=\"{{ s.revStyle }}\">{{ s.rev }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"padding:18px;display:flex;flex-direction:column;gap:14px\">\n                <div>\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;color:#5A6270;margin-bottom:9px\">EVIDENCE BUNDLE<\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:8px\">\n                    <sc-for list=\"{{ a.evidence }}\" as=\"e\" hint-placeholder-count=\"5\">\n                      <div style=\"display:flex;align-items:baseline;gap:10px\">\n                        <span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#5A6270;width:104px;flex:none;letter-spacing:.04em\">{{ e.k }}<\u002Fspan>\n                        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:{{ e.color }};font-variant-numeric:tabular-nums;flex:1;text-align:right\">{{ e.v }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"height:1px;background:rgba(255,255,255,.07)\"><\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#6B7381;line-height:1.55;text-wrap:pretty\">Approving resumes the Step Functions execution at the Guardian state. Rejecting records the decision in evolution_log and leaves the prediction to resolve on its own — which is how the system learns that humans disagreed.<\u002Fdiv>\n                <div style=\"flex:1\"><\u002Fdiv>\n                <div style=\"display:flex;gap:9px\">\n                  <button sc-camel-on-click=\"{{ a.onApprove }}\" style=\"flex:1;padding:10px 0;border-radius:6px;font-size:13px;font-weight:500;letter-spacing:-.005em;border:1px solid rgba(70,211,154,.4);background:rgba(70,211,154,.12);color:#46D39A\" style-hover=\"background:rgba(70,211,154,.2)\">Approve &amp; execute<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ a.onReject }}\" style=\"flex:none;padding:10px 18px;border-radius:6px;font-size:13px;font-weight:500;letter-spacing:-.005em;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:#9AA3B2\" style-hover=\"background:rgba(255,255,255,.07)\">Reject<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <sc-if value=\"{{ noApprovals }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border:1px solid rgba(255,255,255,.075);border-radius:9px;background:#101217;padding:52px 20px;display:flex;flex-direction:column;align-items:center;gap:9px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;color:#5A6270\">QUEUE EMPTY<\u002Fspan>\n            <span style=\"font-size:12.5px;color:#7C8593;text-align:center;max-width:420px;text-wrap:pretty\">Every playbook currently in flight is reversible, so Guardian is executing without asking. Irreversible remediations land here.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"border:1px solid rgba(255,255,255,.075);border-radius:9px;background:#101217;overflow:hidden\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.07)\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;color:#5A6270\">DECISION HISTORY<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ apprHistory }}\" as=\"h\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid rgba(255,255,255,.045)\">\n              <span style=\"{{ h.pillStyle }}\">{{ h.verdict }}<\u002Fspan>\n              <span style=\"font-size:12.5px;color:#B9C0CB;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ h.category }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#6B7381;width:150px\">{{ h.svc }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#5A6270;width:118px\">{{ h.by }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#454C58;width:44px;text-align:right\">{{ h.ago }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;tickMs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:480,&quot;min&quot;:160,&quot;max&quot;:1600,&quot;step&quot;:40,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Simulation&quot;,&quot;label&quot;:&quot;Tick interval&quot;},&quot;autoGate&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.75,&quot;min&quot;:0.5,&quot;max&quot;:0.95,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Policy&quot;,&quot;label&quot;:&quot;Auto-execute gate&quot;},&quot;kNeighbors&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:14,&quot;min&quot;:5,&quot;max&quot;:24,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Retrieval&quot;,&quot;label&quot;:&quot;k (nearest precursors)&quot;}}\">\nconst clamp=(v,a,b)=>Math.max(a,Math.min(b,v));\nconst fx=(n,d)=>Number(n||0).toFixed(d===undefined?2:d);\nconst p2=(n)=>String(n).padStart(2,'0');\nconst mulberry=(s)=>{let a=s>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};};\nconst unit=(v)=>{const m=Math.sqrt(v.reduce((s,x)=>s+x*x,0))||1;return v.map(x=>x/m);};\nconst cos=(a,b)=>{let d=0,na=0,nb=0;for(let i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}return d/(Math.sqrt(na)*Math.sqrt(nb)||1);};\nconst gauss=(r)=>{let u=0,v=0;while(u===0)u=r();while(v===0)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};\nconst gammaS=(k,r)=>{if(k<1)return gammaS(k+1,r)*Math.pow(r()||1e-9,1/k);const d=k-1/3,c=1/Math.sqrt(9*d);for(let i=0;i<120;i++){let x,v;do{x=gauss(r);v=1+c*x;}while(v<=0);v=v*v*v;const u=r();if(u<1-0.0331*x*x*x*x)return d*v;if(Math.log(u||1e-9)<0.5*x*x+d*(1-v+Math.log(v)))return d*v;}return d;};\nconst betaS=(a,b,r)=>{const x=gammaS(a,r),y=gammaS(b,r);return(x/(x+y))||0.5;};\nconst betaGrid=(a,b,N)=>{const xs=[],lps=[];let lm=-1e9;for(let i=0;i<N;i++){const x=(i+0.5)/N;const lp=(a-1)*Math.log(x)+(b-1)*Math.log(1-x);xs.push(x);lps.push(lp);if(lp>lm)lm=lp;}let s=0;const w=lps.map(lp=>{const e=Math.exp(lp-lm);s+=e;return e;});return{xs,w,s};};\nconst betaCI=(a,b)=>{const{xs,w,s}=betaGrid(a,b,300);let c=0,lo=0,hi=1,got=false;for(let i=0;i<xs.length;i++){c+=w[i]/s;if(!got&&c>=0.05){lo=xs[i];got=true;}if(c>=0.95){hi=xs[i];break;}}return[lo,hi];};\nconst betaPath=(a,b,W,H)=>{const{xs,w}=betaGrid(a,b,120);const mx=Math.max.apply(null,w)||1;let d='M0,'+H;for(let i=0;i<xs.length;i++)d+=' L'+fx(xs[i]*W,1)+','+fx(H-(w[i]/mx)*(H-3),1);return d+' L'+W+','+H+' Z';};\nconst ciPath=(a,b,W,H,lo,hi)=>{const{xs,w}=betaGrid(a,b,120);const mx=Math.max.apply(null,w)||1;const pts=[];for(let i=0;i<xs.length;i++)if(xs[i]>=lo&&xs[i]<=hi)pts.push([xs[i]*W,H-(w[i]/mx)*(H-3)]);if(!pts.length)return'';let d='M'+fx(pts[0][0],1)+','+H;pts.forEach(p=>{d+=' L'+fx(p[0],1)+','+fx(p[1],1);});return d+' L'+fx(pts[pts.length-1][0],1)+','+H+' Z';};\nconst linePath=(arr,W,H,lo,hi)=>{if(!arr||arr.length<2)return'';const r=(hi-lo)||1;return arr.map((v,i)=>(i?'L':'M')+fx(i/(arr.length-1)*W,1)+','+fx(H-clamp((v-lo)/r,0,1)*H,1)).join(' ');};\nconst smooth=(a,n)=>a.map((_,i)=>{let s=0,c=0;for(let j=Math.max(0,i-n);j<=Math.min(a.length-1,i+n);j++){s+=a[j];c++;}return s/c;});\nconst areaPath=(arr,W,H,lo,hi)=>{const l=linePath(arr,W,H,lo,hi);return l?('M0,'+H+' '+l.slice(1)+' L'+W+','+H+' Z'):'';};\nconst hlc=(ms,r)=>String(ms)+String(Math.floor(r()*1e6)).padStart(6,'0')+',0';\n\nconst ARCH=[\n {id:'pool-exhaustion',label:'Connection pool exhaustion',short:'POOL',sig:[.95,.60,.30,.20,.15,.80,.10,.70]},\n {id:'memory-leak',label:'Memory leak → OOM',short:'HEAP',sig:[.10,.45,.20,.35,.95,.30,.85,.05]},\n {id:'cache-stampede',label:'Cache stampede',short:'CACHE',sig:[.50,.85,.40,.80,.30,.90,.20,.30]},\n {id:'cert-expiry',label:'Certificate expiry',short:'CERT',sig:[.05,.20,.95,.05,.05,.15,.02,.60]},\n {id:'disk-saturation',label:'Disk saturation',short:'DISK',sig:[.10,.55,.35,.25,.20,.70,.10,.05]},\n {id:'deploy-regression',label:'Deploy latency regression',short:'DEPLOY',sig:[.30,.90,.25,.70,.40,.50,.30,.10]},\n {id:'thread-starvation',label:'Thread-pool starvation',short:'THREAD',sig:[.60,.80,.30,.90,.20,.85,.15,.20]},\n {id:'dns-cascade',label:'DNS timeout cascade',short:'DNS',sig:[.20,.70,.80,.15,.10,.40,.05,.90]}\n];\nconst CHAN=[\n {k:'pool_util',base:38,span:58,unit:'%'},{k:'p99_ms',base:118,span:880,unit:'ms'},\n {k:'error_rate',base:0.14,span:8.5,unit:'%'},{k:'cpu',base:41,span:52,unit:'%'},\n {k:'heap',base:47,span:46,unit:'%'},{k:'queue_depth',base:12,span:320,unit:''},\n {k:'gc_pause',base:8,span:180,unit:'ms'},{k:'conn_churn',base:24,span:260,unit:'/s'}\n];\nconst STEPS={\n 'pool-exhaustion':[['scale_connection_pool',{from:64,to:192}],['drain_idle_connections',{idle_ms:30000}],['enable_load_shedding',{threshold:0.85}]],\n 'memory-leak':[['rolling_restart_workers',{batch:2,wait_s:45}],['cap_heap_growth',{max_mb:3072}],['force_gc_cycle',{}]],\n 'cache-stampede':[['enable_request_coalescing',{window_ms:200}],['prewarm_cache_keys',{top_n:5000}],['stagger_ttl_jitter',{pct:15}]],\n 'cert-expiry':[['rotate_leaf_certificate',{issuer:'acm-private'}],['reload_tls_context',{graceful:true}],['pin_fallback_chain',{}]],\n 'disk-saturation':[['compact_storage_engine',{}],['archive_cold_segments',{older_than_d:14}],['raise_volume_iops',{from:3000,to:9000}]],\n 'deploy-regression':[['shift_traffic_to_prior_revision',{pct:100}],['freeze_rollout',{}],['capture_flame_profile',{sec:30}]],\n 'thread-starvation':[['resize_worker_pool',{from:32,to:96}],['trip_circuit_breaker',{downstream:'fraud-detector'}],['shed_low_priority_queue',{}]],\n 'dns-cascade':[['pin_resolver_to_secondary',{}],['extend_negative_ttl',{sec:5}],['shift_regional_traffic',{from:'us-east-1',to:'eu-west-1',pct:40}]]\n};\nconst INV={scale_connection_pool:'restore_pool_size',drain_idle_connections:'release_reclaim_lock',enable_load_shedding:'disable_load_shedding',rolling_restart_workers:'halt_restart_sequence',cap_heap_growth:'restore_heap_ceiling',force_gc_cycle:'clear_gc_hint',enable_request_coalescing:'disable_request_coalescing',prewarm_cache_keys:'evict_prewarmed_keys',stagger_ttl_jitter:'restore_uniform_ttl',rotate_leaf_certificate:'revert_to_prior_certificate',reload_tls_context:'reload_prior_tls_context',pin_fallback_chain:'unpin_fallback_chain',compact_storage_engine:'abort_compaction',archive_cold_segments:'restore_archived_segments',raise_volume_iops:'restore_volume_iops',shift_traffic_to_prior_revision:'restore_current_revision',freeze_rollout:'resume_rollout',capture_flame_profile:'discard_profile',resize_worker_pool:'restore_worker_pool',trip_circuit_breaker:'reset_circuit_breaker',shed_low_priority_queue:'restore_queue_priority',pin_resolver_to_secondary:'restore_primary_resolver',extend_negative_ttl:'restore_negative_ttl',shift_regional_traffic:'restore_regional_traffic'};\nconst FAM=[\n ['Payment Timeout Recovery','dns-cascade'],['Ledger Drift Recovery','deploy-regression'],\n ['API Cascade Containment','cache-stampede'],['Database Failover','disk-saturation'],\n ['Regional Traffic Shift','dns-cascade'],['Cache Rehydration','cache-stampede'],\n ['Pool Expansion Protocol','pool-exhaustion'],['Heap Reclamation','memory-leak'],\n ['Certificate Rotation','cert-expiry'],['Thread Pool Rebalance','thread-starvation']\n];\nconst VAR=['adaptive backoff','predictive prewarm','staged rollout','bounded blast radius','hedged retry','quorum-aware','shadow-verified','region-pinned'];\nconst EVC={birth:'#7C9EFF',growth:'#46D39A',mutation:'#B98BFF',competition:'#7C8593',merge:'#4FD0E0',promotion:'#F2B457',retirement:'#646C7A',rollback:'#FF6B5E'};\nconst EVG={birth:'+',growth:'↑',mutation:'⋔',competition:'⇄',merge:'⋈',promotion:'★',retirement:'⌀',rollback:'↺'};\nconst TIERC={institutional:'#F2B457',semantic:'#46D39A',episodic:'#7C9EFF',sensory:'#4FD0E0'};\n\nclass Component extends DCLogic{\n constructor(p){super(p);this.state={screen:'overview',selPred:null,selPb:null,selNode:null,regionMenu:null,replay:null,evoFilter:'all',pbFilter:'active',tick:0};this.seed();}\n componentDidMount(){this.arm();}\n componentDidUpdate(prev){if(prev.tickMs!==this.props.tickMs)this.arm();}\n arm(){clearInterval(this.timer);this.timer=setInterval(()=>this.step(),this.props.tickMs||480);}\n componentWillUnmount(){clearInterval(this.timer);}\n gate(){return this.props.autoGate==null?0.75:this.props.autoGate;}\n kk(){return this.props.kNeighbors||14;}\n\n seed(){\n  const r=mulberry(20260819);this.rnd=mulberry(77712);\n  const t0=Date.UTC(2026,7,18,9,14,0);\n  const W={t0:t0,now:t0,tick:0,txns:1284,tps:0,aborted:0,ranges:4118,rebalanced:0,preds:[],approvals:[],evo:[],playbooks:[],snapshots:[],incidents:[],pbSeq:1,prSeq:1,evSeq:1,agents:{},sensory:8240,shadowCount:0};\n  W.regions=[\n   {id:'us-east-1',label:'AWS US East',role:'PRIMARY',nodes:3,lat:8,state:'up'},\n   {id:'eu-west-1',label:'AWS EU West',role:'REGION',nodes:3,lat:74,state:'up'},\n   {id:'ap-south-1',label:'AWS AP South',role:'REGION',nodes:3,lat:181,state:'up'}\n  ];\n  const svcDef=[['checkout-api','us-east-1'],['payment-gateway','us-east-1'],['ledger-service','eu-west-1'],['auth-service','us-east-1'],['notification-router','ap-south-1'],['fraud-detector','eu-west-1'],['inventory-service','ap-south-1']];\n  W.services=svcDef.map(([id,rg])=>{\n   const base=CHAN.map(c=>c.base*(0.82+r()*0.36));\n   const hist=CHAN.map((c,i)=>Array.from({length:60},()=>base[i]*(0.94+r()*0.12)));\n   return{id,region:rg,base,hist,ramp:null,state:'nominal',phase:r()*6.28};\n  });\n  ['Oracle','Sentinel','Guardian','Diagnostician','Chronicler','Receiver','Poller'].forEach((n,i)=>{W.agents[n]={calls:[412,388,196,143,271,2044,0][i],p50:[186,94,1240,2180,410,22,0][i],busy:0,enabled:n!=='Poller'};});\n\n  for(let i=0;i<260;i++){\n   const inc=i<200;const a=ARCH[Math.floor(r()*ARCH.length)];\n   const v=inc?unit(a.sig.map(x=>x+gauss(r)*0.20)):u ce(c,depth+1));\n    const x=(xs[0]+xs[xs.length-1])/2;pos[p.id]={x,y:depth*GY};return x;\n   };\n   (kids['__root']||[]).forEach(r=>{place(r,0);cursor+=0.6;});\n   const maxX=Math.max.apply(null,Object.values(pos).map(p=>p.x).concat([0]));\n   const maxY=Math.max.apply(null,Object.values(pos).map(p=>p.y).concat([0]));\n   const edges=[];\n   pool.forEach(p=>{\n    if(!p.parent||!pos[p.parent]||!pos[p.id])return;\n    const a=pos[p.parent],b=pos[p.id];\n    const x1=a.x+NW/2,y1=a.y+NH,x2=b.x+NW/2,y2=b.y;const my=y1+(y2-y1)/2;\n    const merged=p.merged&&p.merged.length;\n    edges.push({d:'M'+fx(x1,1)+','+fx(y1,1)+' V'+fx(my,1)+' H'+fx(x2,1)+' V'+fx(y2,1),\n     color:merged?'#4FD0E0':p.status!=='active'?'#3E4550':'#B98BFF',w:merged?1.4:1.1,dash:p.status!=='active'?'3 3':'0',o:p.status!=='active'?0.5:0.62});\n    if(p.merged)p.merged.forEach(mid=>{if(pos[mid]){const c=pos[mid];edges.push({d:'M'+fx(c.x+NW/2,1)+','+fx(c.y+NH,1)+' V'+fx(my,1)+' H'+fx(x2,1)+' V'+fx(y2,1),color:'#4FD0E0',w:1.2,dash:'4 3',o:0.55});}});\n   });\n   const zm=S.zoom||0.6;\n   V.zooms=[['Fit',0.42],['60%',0.6],['80%',0.8],['100%',1]].map(([label,z])=>({label,onClick:()=>this.setState({zoom:z}),\n    style:'font-family:\\'JetBrains Mono\\',monospace;font-size:9.5px;letter-spacing:.05em;padding:5px 9px;border-right:1px solid rgba(255,255,255,.06);background:'+(zm===z?'rgba(255,255,255,.07)':'transparent')+';color:'+(zm===z?'#E8EBF0':'#6B7381')}));\n   V.tree={\n    w:maxX+NW+60,h:maxY+NH+60,\n    canvasStyle:'position:relative;width:'+(maxX+NW+80)+'px;height:'+(maxY+NH+80)+'px;padding:28px 0 0 28px;box-sizing:content-box;transform:scale('+zm+');transform-origin:0 0;margin-bottom:'+fx(-(maxY+NH+80)*(1-zm),0)+'px;margin-right:'+fx(-(maxX+NW+80)*(1-zm),0)+'px',\n    edges,\n    nodes:pool.filter(p=>pos[p.id]).map(p=>{\n     const m=this.pbMean(p);const sel=S.selNode===p.id;\n     const col=p.status!=='active'?'#4E5663':p.tier==='institutional'?'#B98BFF':m>0.8?'#46D39A':m>0.5?'#F2B457':'#FF6B5E';\n S',v:'1 region · '+p.svc,color:'#F2B457'},\n      {k:'COMMIT TS',v:p.hlc.slice(0,14)+'…',color:'#646C7A'}\n     ],\n     onApprove:this.decide(p.id,true),onReject:this.decide(p.id,false)};\n   });\n   V.apprHistory=W.preds.filter(p=>p.decidedBy||p.prevention==='rejected').concat(W.preds.filter(p=>p.prevention==='prevented').slice(0,3)).slice(0,6).map(p=>{\n    const rej=p.prevention==='rejected';\n    return{verdict:rej?'REJECTED':'APPROVED',category:this.archOf(p.arch).label,svc:p.svc,by:p.decidedBy||'auto · reversible',ago:this.ago(p.decidedAt||p.created),\n     pillStyle:'font-family:\\'JetBrains Mono\\',monospace;font-size:8.5px;letter-spacing:.08em;padding:2px 6px;border-radius:3px;width:74px;text-align:center;background:'+(rej?'rgba(255,107,94,.13);color:#FF6B5E':'rgba(70,211,154,.11);color:#46D39A')};\n   });\n  }\n\n  return V;\n }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
