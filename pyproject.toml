[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg[binary,pool]",
    "numpy",
    "boto3",
    "langchain",
    "langchain-aws",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

# NEXUS is an application, not a distributable library: the Lambda code ships
# via the SAM layer in layers/shared, so uv must not try to build this repo.
[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
# nexus_common ships as a Lambda layer, so locally it has to be put on the path
# explicitly; scripts/ is here so the seed and verify scripts are importable.
pythonpath = [".", "layers/shared/python", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "frontend", "docs"]
src = [".", "layers/shared/python", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
